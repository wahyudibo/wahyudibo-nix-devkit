auto_sync = true
update_check = true
search_mode = "fuzzy"
filter_mode = "global"
workspaces = true
style = "compact"
inline_height = 20
show_preview = true
max_preview_height = 4
show_help = false
enter_accept = true
secrets_filter = true
command_chaining = true

[stats]
common_subcommands = [
  "apt", "cargo", "composer", "dnf", "docker", "dotnet", "git",
  "go", "ip", "jj", "kubectl", "nix", "nmcli", "npm", "pnpm",
  "podman", "systemctl", "tmux", "yarn"
]
ignored_commands = ["cd", "ls", "vi"]

[sync]
records = true

[keys]
scroll_exits = false

[tmux]
enabled = false

[ui]
columns = ["duration", "time", "command"]
